; ==== RAINMETER SECTION ====

[Rainmeter]
Update=16
DynamicWindowSize=1
AccurateText=1
Draggable=1
KeepOnScreen=0

; ==== VARIABLES SECTION ====

[Variables]
; Your preferred position (keep your huge coords)
X=3240
Y=1203
GroundY=1203 ; NOTE: Do I need this twice?
BaseOffsetY=0
; READ:
ReadOffsetY=37
; BALL
BallDuration=600
; DRUNK
DrunkFrames=5
DrunkFrameDelay=18
; SLEEP
SleepFrames=15
SleepFrameDelay=10
; PEEK
PeekMargin=40
PeekOffscreen=80

; ==== MEASURE SECTION ====

; MEASURE THE SCREEN WIDTH
[MeasureMonW]
Measure=Calc
Formula=#SCREENAREAWIDTH#
DynamicVariables=1

;MEASURE THE SCREEN HEIGHT
[MeasureMonH]
Measure=Calc
Formula=#SCREENAREAHEIGHT#
DynamicVariables=1

; MEASURE THE SCREEN X
[MeasureMonX]
Measure=Calc
Formula=#SCREENAREAX#
DynamicVariables=1

; MEASURE THE SCREEN Y
[MeasureMonY]
Measure=Calc
Formula=#SCREENAREAY#
DynamicVariables=1

; Mood Variables
MoodWeightHunger=0.25
MoodWeightEnergy=0.20
MoodWeightClean=0.15
MoodWeightSocial=0.20
MoodWeightHealth=0.20

MoodInertia=0.10
MoodEventDecayPerSec=0.995

MoodMin=0
MoodMax=100

MoodMiserableMax=19
MoodSadMax=39
MoodNeutralMax=59
MoodHappyMax=79

; GAMING MODE
; --- Gaming mode assets ---
GameIntroFrames=3
GameLoopFrames=14
GameIntroDelay=20
GameLoopDelay=6

; --- Gaming mode position (pick a corner) ---
GameX=0
GameY=1203

; READING MODE
; Reading after 5pm
ReadStartHour=17
ReadFrames=6
ReadFrameDelay=20
ReadMin=300
ReadMax=900
ReadYOffset=20

; MOVEMENT
; movement tuning
Step=4
SpriteW=320

; ANIMATION
; animation frames (unpadded filenames!)
IdleFrames=27
WalkFrames=3

; how many updates per frame (bigger = slower)
IdleFrameDelay=6
WalkFrameDelay=6

; random durations (in ticks, ~60 ticks/sec)
IdleMin=120
IdleMax=360
WalkMin=60
WalkMax=220

; rubber band ball animation
InactiveTicks=1800
BallFrames=7
BallFrameDelay=6

; MEASURE SCREEN W -- NOTE; IS THIS REDUNDANT OR DO I NEED BOTH?
[MeasureScreenW]
Measure=Calc
Formula=#SCREENAREAWIDTH#

; MEASURE SCREEN H -- NOTE; IS THIS REDUNDANT OR DO I NEED BOTH?
[MeasureScreenH]
Measure=Calc
Formula=#SCREENAREAHEIGHT#

; LUA FILE LINK
[MeasureScript]
Measure=Script
ScriptFile=Dazai.lua
UpdateDivider=1

; NO LONGER BEING USED -- REMOVE
[MeasureFullscreen]
Measure=Plugin
Plugin=RunCommand
Program="%ComSpec%"
Parameter=/c "echo FS_TEST_1"
OutputType=ANSI
UpdateDivider=1
DynamicVariables=1
FinishAction=[!UpdateMeter MeterFS][!Redraw]

; MEASURE SCREEN X -- NOTE IS THIS REDUNDANT OR DO I NEED BOTH?
[MeasureWinX]
Measure=Calc
Formula=#CURRENTCONFIGX#
DynamicVariables=1

; MEASURE SCREEN Y -- NOTE IS THIS REDUNDANT OR DO I NEED BOTH?
[MeasureWinY]
Measure=Calc
Formula=#CURRENTCONFIGY#
DynamicVariables=1

; ==== METER SECTION ====
[MeterDazai]
   Meter=Image
   ImageName=images\idle_1.png
   DynamicVariables=1
   X=0
   Y=#BaseOffsetY#
   W=200
   PreserveAspectRatio=1
   Group=Draggable
   SolidColor=0,0,0,1             ; <--- VERY IMPORTANT
   MouseActionCursor=Hand
   LeftMouseUpAction=[!CommandMeasure MeasureScript "OnMouseUp()"]
   LeftMouseDoubleClickAction=[!CommandMeasure MeasureScript "OnDoubleClick()"]
   ImageRotate=0

; PET PANEL (hidden by default)
[MeterPetPanelBG]
